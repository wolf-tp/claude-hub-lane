name: ci
on:
  push: { branches: [main] }
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: lock registry
        run: bash assets/skills/hub/tests/lane-coord.test.sh
      - name: PreToolUse gate
        run: bash assets/skills/hub/tests/lane-gate.test.sh
      - name: installer (against a fake HOME)
        run: HUB_LANE_SRC="$PWD/assets" bash assets/skills/hub/tests/install.test.sh
      - name: npx entry point installs into a scratch HOME
        run: |
          npm pack --silent
          TMP=$(mktemp -d); export HOME="$TMP"
          npm i -g ./claude-hub-lane-*.tgz --silent
          claude-hub-lane --help
          if claude-hub-lane check >/dev/null 2>&1; then echo "check passed before installing"; exit 1; fi
          claude-hub-lane
          claude-hub-lane check
          test -x "$HOME/.claude/bin/lane-coord.sh"
          grep -q 'HOME/.claude/bin/lane-gate.py' "$HOME/.claude/settings.json"
